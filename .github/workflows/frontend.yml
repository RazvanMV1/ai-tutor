name: Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: src/frontend/AiTutor.Web
        run: dotnet restore

      - name: Build
        working-directory: src/frontend/AiTutor.Web
        run: dotnet build --no-restore

  docker-build:
    name: Docker Build & Push to ACR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: aitutorrazvan2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: src/frontend/AiTutor.Web
          file: src/frontend/AiTutor.Web/Dockerfile
          push: true
          tags: aitutorrazvan2026.azurecr.io/frontend:latest

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Frontend to Container Apps
        run: |
          az containerapp update \
            --name "aitutor-frontend" \
            --resource-group "aitutor-rg" \
            --image "aitutorrazvan2026.azurecr.io/frontend:latest"
