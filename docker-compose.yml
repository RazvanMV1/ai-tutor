version: '3.9'
services:
  # ── Baza de date ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aitutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend .NET 10 ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: src/backend/AiTutor.API/Dockerfile
    container_name: aitutor-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationHours=${JWT_EXPIRATION_HOURS}
      - AiModule__BaseUrl=http://ai-module:8000
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── AI Module Python ──────────────────────────────────────────
  ai-module:
    build:
      context: src/ai-module
      dockerfile: Dockerfile
    container_name: aitutor-ai-module
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DOTNET_API_BASE_URL=http://backend:8080
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./src/ai-module:/app
    depends_on:
      - backend

  # ── Frontend Blazor WASM (nginx) ──────────────────────────────
  frontend:
    build:
      context: src/frontend/AiTutor.Web
      dockerfile: Dockerfile
    container_name: aitutor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
