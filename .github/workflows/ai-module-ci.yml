name: AI Module CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ai-module/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/ai-module/**'

jobs:
  build-and-test:
    name: Build & Test AI Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: src/ai-module
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: src/ai-module
        env:
          OPENAI_API_KEY: "test-key"
          DOTNET_API_BASE_URL: "http://localhost:5000"
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AI Module image
        uses: docker/build-push-action@v5
        with:
          context: src/ai-module
          file: src/ai-module/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aitutor-ai-module:latest
