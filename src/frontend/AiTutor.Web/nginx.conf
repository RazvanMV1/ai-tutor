events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json
        application/wasm application/octet-stream
        font/woff font/woff2;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Static assets (Blazor WASM files) ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|wasm|dll|dat|blat|pdb|br|gz)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Nu cache-uim index.html ──
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
        }

        # ── Proxy /api/ → backend .NET ──
        location /api/ {
            proxy_pass         https://aitutor-backend.livelytree-7ffb4953.swedencentral.azurecontainerapps.io;
            proxy_http_version 1.1;
            proxy_set_header   Host aitutor-backend.livelytree-7ffb4953.swedencentral.azurecontainerapps.io;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "keep-alive";
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_ssl_server_name on;
        }


        # ── Blazor WASM SPA routing ──
        # Toate celelalte route-uri → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
