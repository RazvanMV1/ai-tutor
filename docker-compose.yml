version: '3.9'

services:
  # ── Baza de date ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aitutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend .NET 10 ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: src/backend/AiTutor.API/Dockerfile
    container_name: aitutor-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aitutor;Username=postgres;Password=postgres
      - JwtSettings__SecretKey=AiTutorSuperSecretKey2024!MustBe32Chars!!
      - JwtSettings__Issuer=AiTutor.API
      - JwtSettings__Audience=AiTutor.Client
      - JwtSettings__ExpirationHours=24
      - AiModule__BaseUrl=http://ai-module:8000
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || curl -f http://localhost:8080/api/health || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── AI Module Python ──────────────────────────────────────────
  ai-module:
    build:
      context: src/ai-module
      dockerfile: Dockerfile
    container_name: aitutor-ai-module
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=AIzaSyATFWsmtiNkBgEUWKyIhTmolI1JLwCsKj0
      - OPENAI_API_KEY=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
      - DOTNET_API_BASE_URL=http://backend:8080
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./src/ai-module:/app
    depends_on:
      - backend

  # ── Frontend Blazor WASM (nginx) ──────────────────────────────
  frontend:
    build:
      context: src/frontend/AiTutor.Web
      dockerfile: Dockerfile
    container_name: aitutor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
