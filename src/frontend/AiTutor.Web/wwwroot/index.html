<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiTutor – Platformă Educațională AI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- MudBlazor Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        #app { background: #F0F4F8; min-height: 100vh; }
        .loading-progress { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .loading-progress circle {
            fill: none;
            stroke: #1976D2;
            stroke-width: 3px;
            stroke-dasharray: 255%;
            stroke-dashoffset: 25%;
        }
        .loading-progress circle:last-child {
            stroke: #FF6B35;
            stroke-dasharray: calc(var(--blazor-load-percentage, 0%) * 0.8);
            transition: stroke-dasharray 0.05s ease-in-out;
        }
        .loading-progress-text::after {
            content: var(--blazor-load-percentage-text, "Se încarcă...");
            color: #546E7A;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" width="80" height="80">
            <circle r="35%" cx="50%" cy="50%" />
            <circle r="35%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text" style="text-align:center;margin-top:100px;color:#546E7A"></div>
    </div>

    <div id="blazor-error-ui">
        A apărut o eroare. <a href="." class="reload">Reîncarcă</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
